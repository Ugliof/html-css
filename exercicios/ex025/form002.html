<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1>Teste de Formulario</h1>
    <form action="cadastro.php" method="POST" autocomplete="off">
        <p>
            <label for="isu">Usuario</label>
            <input type="text" name="usu" id="isu" required minlength="5" maxlength="25" size="10">
        </p>
        <p>
            <label for="sen">Senha</label>
            <input type="password" name="sen" id="isen" required minlength="8" maxlength="15" size="10" placeholder="minimo 8 letras">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
